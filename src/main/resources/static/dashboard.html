<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS - Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container dashboard-container">
        <h2>User Dashboard</h2>
        <div style="text-align: right;">
            <button onclick="logout()" style="width: auto; background-color: #e74c3c;">Logout</button>
        </div>

        <div class="profile-info">
            <h3>Profile Information</h3>
            <p><strong>Name:</strong> <span id="userName">Loading...</span></p>
            <p><strong>Email:</strong> <span id="userEmail">Loading...</span></p>
            <p><strong>Role:</strong> <span id="userRole">Loading...</span></p>
        </div>

        <div class="form-group">
            <h3>Update Profile</h3>
            <div class="form-group">
                <label for="updateName">New Name</label>
                <input type="text" id="updateName">
            </div>
            <button onclick="updateProfile()">Update Name</button>
            <div id="updateMessage" style="margin-top: 10px;"></div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        checkAuth();

        // Load Profile
        async function loadProfile() {
            try {
                const response = await fetchAuth('/api/users/me');
                if (response.ok) {
                    const user = await response.json();
                    document.getElementById('userName').textContent = user.name;
                    document.getElementById('userEmail').textContent = user.email;
                    document.getElementById('userRole').textContent = user.role;
                    document.getElementById('updateName').value = user.name;

                    // Redirect if Admin
                    if (user.role === 'ADMIN') {
                        window.location.href = 'admin-dashboard.html';
                    }
                }
            } catch (error) {
                console.error('Error loading profile', error);
            }
        }

        // Update Profile
        async function updateProfile() {
            const newName = document.getElementById('updateName').value;
            const message = document.getElementById('updateMessage');

            try {
                // Note: The backend currently does not have a user update endpoint in UserController.
                // This is a placeholder or needs to be implemented in backend if required.
                // For now, we will simulate or show not implemented.
                message.style.color = 'orange';
                message.textContent = 'Profile update not yet implemented in backend.';

                /* 
                // Future Implementation:
                const response = await fetchAuth('/api/users/me', {
                    method: 'PUT',
                    body: JSON.stringify({ name: newName })
                });

                if (response.ok) {
                    const user = await response.json();
                    document.getElementById('userName').textContent = user.name;
                    message.style.color = 'green';
                    message.textContent = 'Profile updated successfully!';
                } else {
                    message.style.color = 'red';
                    message.textContent = 'Failed to update profile.';
                }
                */
            } catch (error) {
                message.style.color = 'red';
                message.textContent = 'Error updating profile.';
            }
        }

        loadProfile();
    </script>
</body>

</html>
