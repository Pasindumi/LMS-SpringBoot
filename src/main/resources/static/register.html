<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS - Register</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="auth-body">
    <div class="auth-card" style="max-width: 500px;">
        <div class="auth-header">
            <h1 style="color: var(--primary); font-size: 2rem; margin-bottom: 0.5rem;"><i
                    class="fas fa-graduation-cap"></i> LMS PRO</h1>
            <h2>Create Account</h2>
            <p>Join the LMS community today</p>
        </div>
        <form id="registerForm" class="auth-form">
            <div class="form-group">
                <label for="name">Full Name</label>
                <div class="input-icon-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="name" placeholder="John Doe" required>
                </div>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-icon-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" placeholder="name@example.com" required>
                </div>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-icon-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
            </div>
            <div class="form-group">
                <label for="role">I am a...</label>
                <div class="input-icon-group">
                    <i class="fas fa-user-tag"></i>
                    <select id="role" required>
                        <option value="STUDENT">Student</option>
                        <option value="INSTRUCTOR">Instructor</option>
                        <option value="ADMIN">Admin</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="btn-primary auth-btn">Create Account</button>
        </form>
        <div id="message" style="text-align: center; margin-top: 1rem; font-size: 0.875rem; font-weight: 500;"></div>
        <div class="auth-footer">
            Already have an account? <a href="login.html">Login</a>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;
            const message = document.getElementById('message');

            try {
                const response = await fetch(API_URL + '/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, role })
                });

                if (response.ok) {
                    message.style.color = 'green';
                    message.textContent = 'Registration successful! Redirecting...';
                    setTimeout(() => window.location.href = 'login.html', 1500);
                } else {
                    const errorText = await response.text();
                    message.style.color = 'red';
                    message.textContent = 'Registration failed: ' + errorText;
                }
            } catch (error) {
                message.style.color = 'red';
                message.textContent = 'Registration failed';
            }
        });
    </script>
</body>

</html>
