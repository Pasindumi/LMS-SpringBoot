<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS - Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="auth-body">
    <div class="auth-card">
        <div class="auth-header">
            <h1 style="color: var(--primary); font-size: 2rem; margin-bottom: 0.5rem;"><i
                    class="fas fa-graduation-cap"></i> LMS PRO</h1>
            <h2>Welcome Back</h2>
            <p>Login to your account to continue your journey</p>
        </div>
        <form id="loginForm" class="auth-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-icon-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" placeholder="name@example.com" required>
                </div>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-icon-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
            </div>
            <button type="submit" class="btn-primary auth-btn">Login</button>
        </form>
        <div id="message"
            style="color: #ef4444; text-align: center; margin-top: 1rem; font-size: 0.875rem; font-weight: 500;"></div>
        <div class="auth-footer">
            Don't have an account? <a href="register.html">Register</a>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const message = document.getElementById('message');

            try {
                const response = await fetch(API_URL + '/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('token', data.token);

                    // Fetch user details to determine role
                    try {
                        const userRes = await fetch('http://localhost:8081/api/users/me', {
                            headers: { 'Authorization': 'Bearer ' + data.token }
                        });
                        if (userRes.ok) {
                            const user = await userRes.json();
                            if (user.role === 'ADMIN') {
                                window.location.href = 'admin-dashboard.html';
                            } else if (user.role === 'INSTRUCTOR' || user.role === 'LECTURER') {
                                window.location.href = 'instructor-dashboard.html';
                            } else if (user.role === 'STUDENT') {
                                window.location.href = 'student-dashboard.html';
                            } else {
                                window.location.href = 'dashboard.html';
                            }
                        } else {
                            window.location.href = 'dashboard.html';
                        }
                    } catch (e) {
                        window.location.href = 'dashboard.html';
                    }
                } else {
                    message.textContent = 'Invalid credentials';
                }
            } catch (error) {
                message.textContent = 'Login failed';
            }
        });
    </script>
</body>

</html>
